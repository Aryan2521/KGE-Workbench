[project]
name = "repro-kge-evaluation"
version = "2.0.0"
description = "Reproducible evaluation framework for deterministic and uncertainty-aware KGE models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "numpy>=2.0,<3",
    "torch>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
